<!DOCTYPE html>
<html lang="en-US">
<head>
<base target="_top" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDAX</title>
<style>
  :root { --green:#2bb24c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:#f6f7f8; overflow:hidden; }

  /* Blurred dashboard mock behind the overlay */
  .bg { position:fixed; inset:0; filter:blur(7px); opacity:.22; pointer-events:none; padding:28px; }
  .bar { height:52px; background:#fff; border-radius:8px; margin-bottom:24px; box-shadow:0 1px 6px rgba(0,0,0,.05); }
  .cols { display:grid; grid-template-columns:1fr 1.4fr; gap:28px; max-width:1300px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 8px rgba(0,0,0,.05); padding:22px; }
  .pill { height:18px; width:60%; background:#e9ecef; border-radius:6px; margin-bottom:14px; }
  .pill.sm { width:35%; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:18px; }
  .coin { text-align:center; }
  .dot { width:40px; height:40px; border-radius:50%; margin:0 auto 8px; }
  .g { background:#2bb24c; } .y { background:#f0b429; } .b { background:#3b82f6; } .o { background:#f97316; }
  .line { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid #f0f1f3; }
  .line .dot { width:34px; height:34px; margin:0; }
  .line .txt { flex:1; }

  /* Overlay */
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .spinner { width:46px; height:46px; border-radius:50%; border:3px solid #d7dadd; border-top-color:var(--green); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .msg { color:#5b6168; font-size:19px; font-weight:400; }
</style>
</head>
<body>
  <div class="bg">
    <div class="bar"></div>
    <div class="cols">
      <div>
        <div class="card">
          <div class="pill"></div>
          <div class="pill sm"></div>
        </div>
        <div class="card" style="margin-top:20px;">
          <div class="grid">
            <div class="coin"><div class="dot g"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot g"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot y"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot g"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot b"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot o"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
            <div class="coin"><div class="dot g"></div><div class="pill" style="width:80%;margin:0 auto;height:10px;"></div></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="pill sm"></div>
        <div class="line"><div class="dot g"></div><div class="txt"><div class="pill" style="height:12px;"></div></div></div>
        <div class="line"><div class="dot y"></div><div class="txt"><div class="pill sm" style="height:12px;"></div></div></div>
        <div class="line"><div class="dot b"></div><div class="txt"><div class="pill" style="height:12px;"></div></div></div>
        <div class="line"><div class="dot g"></div><div class="txt"><div class="pill sm" style="height:12px;"></div></div></div>
        <div class="line"><div class="dot g"></div><div class="txt"><div class="pill" style="height:12px;"></div></div></div>
      </div>
    </div>
  </div>

  <div class="overlay">
    <div class="spinner"></div>
    <div class="msg" id="msg">Please wait while we secure your session...</div>
  </div>

  <script>
    var msgs = ["Please wait while we secure your session...", "Connecting..."];
    var i = 0;
    var el = document.getElementById('msg');
    setInterval(function () {
      i = (i + 1) % msgs.length;
      el.textContent = msgs[i];
    }, 2500);
  </script>
</body>
</html>
